name: CI

on:
  push:
    branches: [dev, uat, prod]
  pull_request:
    branches: [dev, uat, prod]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: npm run typecheck

      - run: npm run build

      - name: Build Docker image
        run: docker build -t chiguru-backend:ci .
